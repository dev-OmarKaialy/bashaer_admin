<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="لوحة إدارة البشائر لتعليم القيادة">
  <!-- Admin tool: keep it out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2e6bff">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="إدارة البشائر">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>لوحة إدارة البشائر</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Brand splash in plain HTML/CSS: visible within the first paint while the
       Flutter engine downloads, removed on Flutter's first frame. */
    html, body { margin: 0; height: 100%; background: #f3f6fd; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: linear-gradient(135deg, #7c4dff 0%, #2e6bff 55%, #00b8d9 100%);
      transition: opacity 160ms ease-out;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 12px 32px rgba(20, 27, 52, 0.25); }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.3); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #fff;
      animation: splash-slide 1s ease-in-out infinite;
    }
    @keyframes splash-slide { from { transform: translateX(160%); } to { transform: translateX(-160%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="جارٍ التحميل">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 200);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
